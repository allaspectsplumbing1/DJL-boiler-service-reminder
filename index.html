<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boiler Service Reminder</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:620px;margin:0 auto;padding:32px 20px;line-height:1.5;background:#f7f7f7;color:#171717}
.card{background:white;border-radius:16px;padding:28px;box-shadow:0 4px 18px #0001}
h1{margin-top:0} button{font:inherit;font-weight:700;padding:14px 18px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
.small{font-size:.92rem;color:#555;margin-top:18px}
a{color:inherit}

</style>
</head>
<body>
<div class="card">
<h1>Boiler Service Reminder</h1>
<p>Add a reminder for your next boiler service, one year from today.</p>
<button id="add">Add boiler service reminder</button>
<p class="small">Phone DJL Heating Ltd <a href="tel:07545993861">07886&nbsp;372&nbsp;134</a>.</p>
<img src = "IMG_0100.png" alt = "Boiler Service qr code" style="max-width:220px; width:100%;margin-top: 12px;display:block;">
</div>
<script>
function ymdUTC(d){return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')}
document.getElementById('add').addEventListener('click',()=>{
  const now=new Date();
  const start=new Date(Date.UTC(now.getFullYear()+1,now.getMonth(),now.getDate()));
  const end=new Date(start); end.setUTCDate(end.getUTCDate()+1);
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Boiler Service Reminder//EN',
    'CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:boiler-service-'+Date.now()+'@reminder',
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'),
    'DTSTART;VALUE=DATE:'+ymdUTC(start),
    'DTEND;VALUE=DATE:'+ymdUTC(end),
    'SUMMARY:Boiler service due - call 07545993861',
    'DESCRIPTION:Your boiler service is due. Call 07545993861 to arrange your service.',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='boiler-service-reminder.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
</script>
</body>
</html>
